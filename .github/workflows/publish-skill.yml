name: Publish skills

on:
  pull_request_target:
    types: [closed]
    paths:
      - "skills/**"
      - "governance/**"
  workflow_dispatch:
    inputs:
      ref:
        description: Commit to use when rebuilding the registry
        required: false
        default: main

permissions:
  contents: read

concurrency:
  group: skillhub-publish
  cancel-in-progress: false

jobs:
  prepare:
    if: github.event_name == 'pull_request_target' && github.event.pull_request.merged == true && github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      source_commit: ${{ steps.plan.outputs.source_commit }}
      plan: ${{ steps.plan.outputs.plan }}
    steps:
      - name: Check out trusted merged commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Validate merge and resolve release plan
        id: plan
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          SOURCE_COMMIT: ${{ github.event.pull_request.merge_commit_sha }}
          PR_LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { appendFile } from 'node:fs/promises';
          import semver from 'semver';
          import { getChangedSkills } from './scripts/changed-skills.mjs';
          import { validateSkill, validateVersionLabels } from './scripts/validate.mjs';
          import { GitHubApi } from './scripts/github.mjs';
          const slugs = await getChangedSkills({ before: process.env.BASE_SHA, after: process.env.SOURCE_COMMIT });
          const plan = [];
          if (slugs.length) {
            const bump = validateVersionLabels(JSON.parse(process.env.PR_LABELS));
            const releases = await new GitHubApi().listReleases();
            for (const slug of slugs) {
              await validateSkill(`skills/${slug}`);
              const versions = releases.map(r => new RegExp(`^${slug}-v(.+)$`).exec(r.tag_name)?.[1]).filter(v => semver.valid(v));
              const current = versions.sort(semver.rcompare)[0] ?? '0.0.0';
              plan.push({ slug, version: semver.inc(current, bump) });
            }
          }
          await appendFile(process.env.GITHUB_OUTPUT, `source_commit=${process.env.SOURCE_COMMIT}\nplan=${JSON.stringify(plan)}\n`);
          NODE

  release:
    needs: [prepare]
    if: needs.prepare.result == 'success' && needs.prepare.outputs.plan != '[]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out trusted merged commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.prepare.outputs.source_commit }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Publish changed skills
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SOURCE_COMMIT: ${{ needs.prepare.outputs.source_commit }}
          PLAN: ${{ needs.prepare.outputs.plan }}
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { publishSkill } from './scripts/publish-skill.mjs';
          for (const item of JSON.parse(process.env.PLAN)) {
            await publishSkill({ skillDir: `skills/${item.slug}`, version: item.version, sourceCommit: process.env.SOURCE_COMMIT });
          }
          NODE

  registry:
    if: always() && (github.event_name == 'workflow_dispatch' || (needs.prepare.result == 'success' && (needs.release.result == 'success' || needs.release.result == 'skipped')))
    needs: [prepare, release]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out trusted source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || needs.prepare.outputs.source_commit }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Build and verify complete registry
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          mkdir -p _site/registry/v1
          node scripts/build-registry.mjs --output _site/registry/v1/registry.json
          node scripts/check-registry.mjs --file _site/registry/v1/registry.json --online

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: _site

  pages:
    if: always() && needs.registry.result == 'success'
    needs: [registry]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy registry to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
